<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>Аларм ПЛК</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #121418; color: #f2f2f2; }
  header { padding: 16px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  #link { color: #9bd; font-size: 14px; }
  #screen { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  #screen.hot { background: #8d1218; }
  button { font-size: 22px; padding: 18px 22px; border: 0; border-radius: 8px; }
  #arm { background: #1b6df1; color: #fff; }
  #ack { background: #f4f4f4; color: #111; display: none; }
  ul { list-style: none; padding: 0; margin: 16px 0; }
  li { margin: 8px 0; font-size: 20px; }
  #quiet { font-size: 18px; color: #b7b7b7; }
</style>
</head>
<body>
<header>
  <h1>Ожидание аларма</h1>
  <div id="link">Связь с сервером проверяется</div>
</header>
<div id="screen">
  <p id="quiet">Активных алармов нет</p>
  <ul id="list"></ul>
  <button id="arm" type="button">Включить звук</button>
  <button id="ack" type="button">Слышу, принято</button>
</div>
<script>
(function () {
  var token = (document.querySelector('meta[name="token"]').content || "").trim();
  var q = token ? ("?token=" + encodeURIComponent(token)) : "";
  var audio = null;
  var osc = null;
  var timer = null;
  var armed = false;
  var high = true;

  function query(path) {
    return path + q;
  }

  function stopSiren() {
    if (timer) clearInterval(timer);
    timer = null;
    if (osc) {
      try { osc.stop(); } catch (e) {}
      osc = null;
    }
  }

  function startSiren() {
    if (!armed || !audio || osc) return;
    if (audio.state === "suspended") audio.resume();
    osc = audio.createOscillator();
    var gain = audio.createGain();
    osc.type = "square";
    osc.frequency.value = 880;
    gain.gain.value = 0.25;
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    high = true;
    timer = setInterval(function () {
      high = !high;
      if (osc) osc.frequency.value = high ? 880 : 520;
    }, 180);
    if (navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500]);
  }

  function render(live) {
    var screen = document.getElementById("screen");
    var list = document.getElementById("list");
    var quiet = document.getElementById("quiet");
    var ack = document.getElementById("ack");
    list.innerHTML = "";
    if (!live.length) {
      screen.className = "";
      quiet.style.display = "block";
      ack.style.display = "none";
      stopSiren();
      return;
    }
    screen.className = "hot";
    quiet.style.display = "none";
    ack.style.display = "inline-block";
    live.forEach(function (row) {
      var li = document.createElement("li");
      li.textContent = row.title + (row.message ? " — " + row.message : "");
      list.appendChild(li);
    });
    startSiren();
  }

  function tick() {
    fetch(query("/state")).then(function (r) {
      if (!r.ok) throw new Error("http " + r.status);
      return r.json();
    }).then(function (data) {
      document.getElementById("link").textContent = "Связь есть";
      var live = (data.alarms || []).filter(function (row) {
        return row.active && !row.acked;
      });
      render(live);
    }).catch(function () {
      document.getElementById("link").textContent = "Нет связи с сервером";
    });
  }

  document.getElementById("arm").addEventListener("click", function () {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audio = audio || new AC();
    audio.resume();
    armed = true;
    document.getElementById("arm").textContent = "Звук включён";
    tick();
  });

  document.getElementById("ack").addEventListener("click", function () {
    fetch(query("/state")).then(function (r) { return r.json(); }).then(function (data) {
      (data.alarms || []).forEach(function (row) {
        if (row.active && !row.acked) {
          fetch("/ack/" + encodeURIComponent(row.id) + q, { method: "POST" });
        }
      });
    });
    stopSiren();
  });

  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
